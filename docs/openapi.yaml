openapi: 3.0.3
info:
  title: Library REST API
  description: |
    REST API for managing library books, clients, and active book loans.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Books
    description: Book catalogue operations
  - name: Clients
    description: Library client operations
  - name: Loans
    description: Book assignment and return operations

paths:
  /api/v1/books:
    get:
      tags: [Books]
      summary: Get all books
      operationId: getAllBooks
      responses:
        '200':
          description: List of books
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/BookCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/BookCollection'
    post:
      tags: [Books]
      summary: Create a book
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
            example:
              title: Clean Code
              author: Robert C. Martin
              isbn: '9780132350884'
              publicationYear: 2008
              quantity: 5
      responses:
        '201':
          description: Book created
          headers:
            Location:
              description: URI of the created book
              schema:
                type: string
                format: uri
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/BookResource'
            application/json:
              schema:
                $ref: '#/components/schemas/BookResource'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [Books]
      summary: Delete all books
      description: Deletes all books. Related active loan records are also removed by the service.
      operationId: deleteAllBooks
      responses:
        '204':
          description: All books deleted

  /api/v1/books/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Books]
      summary: Get a book by ID
      operationId: getBookById
      responses:
        '200':
          description: Book found
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/BookResource'
            application/json:
              schema:
                $ref: '#/components/schemas/BookResource'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Books]
      summary: Update a book
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '200':
          description: Book updated
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/BookResource'
            application/json:
              schema:
                $ref: '#/components/schemas/BookResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Books]
      summary: Delete a book by ID
      operationId: deleteBook
      responses:
        '204':
          description: Book deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/clients:
    get:
      tags: [Clients]
      summary: Get all clients
      operationId: getAllClients
      responses:
        '200':
          description: List of clients
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ClientCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCollection'
    post:
      tags: [Clients]
      summary: Create a client
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
            example:
              name: Alex Johnson
              email: alex@example.com
      responses:
        '201':
          description: Client created
          headers:
            Location:
              description: URI of the created client
              schema:
                type: string
                format: uri
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ClientResource'
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResource'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [Clients]
      summary: Delete all clients
      description: Deletes all clients and their active loan records; returned copies are restored to book availability.
      operationId: deleteAllClients
      responses:
        '204':
          description: All clients deleted

  /api/v1/clients/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Clients]
      summary: Get a client by ID
      operationId: getClientById
      responses:
        '200':
          description: Client found
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ClientResource'
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResource'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clients]
      summary: Update a client
      operationId: updateClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
      responses:
        '200':
          description: Client updated
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ClientResource'
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Clients]
      summary: Delete a client by ID
      description: Deletes the client and their active loan records; returned copies are restored to book availability.
      operationId: deleteClient
      responses:
        '204':
          description: Client deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/clients/{id}/books:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Clients]
      summary: Get books currently assigned to a client
      operationId: getBooksOfClient
      responses:
        '200':
          description: Books assigned to the client
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/BookCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/BookCollection'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/loans:
    get:
      tags: [Loans]
      summary: Get all active loans
      operationId: getAllLoans
      responses:
        '200':
          description: List of active loans
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/LoanCollection'
            application/json:
              schema:
                $ref: '#/components/schemas/LoanCollection'
    post:
      tags: [Loans]
      summary: Assign a book to a client
      description: |
        Creates an active loan and decreases the book's available quantity by one.
        Returns 409 Conflict if no copies are available.
      operationId: assignBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanRequest'
            example:
              clientId: 1
              bookId: 1
      responses:
        '201':
          description: Book assigned; active loan created
          headers:
            Location:
              description: URI of the created loan
              schema:
                type: string
                format: uri
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/LoanResource'
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Loans]
      summary: Return all books and delete all active loans
      description: Restores the available quantity for every active loan, then removes all loan records.
      operationId: returnAllBooks
      responses:
        '204':
          description: All active loans removed and books returned

  /api/v1/loans/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Loans]
      summary: Get an active loan by ID
      operationId: getLoanById
      responses:
        '200':
          description: Active loan found
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/LoanResource'
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResource'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Loans]
      summary: Return a book
      description: Restores one copy to the book's available quantity and deletes the active loan.
      operationId: returnBook
      responses:
        '204':
          description: Book returned
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Resource identifier
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    BookRequest:
      type: object
      required: [title, author, isbn, publicationYear, quantity]
      properties:
        title:
          type: string
          maxLength: 200
        author:
          type: string
          maxLength: 150
        isbn:
          type: string
          maxLength: 20
          pattern: '^[0-9Xx-]{10,20}$'
        publicationYear:
          type: integer
          minimum: 0
          maximum: 2100
        quantity:
          type: integer
          minimum: 0
          description: Number of currently available copies
    Book:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        author:
          type: string
        isbn:
          type: string
        publicationYear:
          type: integer
        quantity:
          type: integer
          description: Number of currently available copies
    BookResource:
      allOf:
        - $ref: '#/components/schemas/Book'
        - $ref: '#/components/schemas/HalLinks'
    BookCollection:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            bookList:
              type: array
              items:
                $ref: '#/components/schemas/BookResource'
        _links:
          $ref: '#/components/schemas/Links'
    ClientRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 150
    Client:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
    ClientResource:
      allOf:
        - $ref: '#/components/schemas/Client'
        - $ref: '#/components/schemas/HalLinks'
    ClientCollection:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            clientList:
              type: array
              items:
                $ref: '#/components/schemas/ClientResource'
        _links:
          $ref: '#/components/schemas/Links'
    LoanRequest:
      type: object
      required: [clientId, bookId]
      properties:
        clientId:
          type: integer
          format: int64
          minimum: 1
        bookId:
          type: integer
          format: int64
          minimum: 1
    Loan:
      type: object
      properties:
        id:
          type: integer
          format: int64
        clientId:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        assignedAt:
          type: string
          format: date-time
    LoanResource:
      allOf:
        - $ref: '#/components/schemas/Loan'
        - $ref: '#/components/schemas/HalLinks'
    LoanCollection:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            loanList:
              type: array
              items:
                $ref: '#/components/schemas/LoanResource'
        _links:
          $ref: '#/components/schemas/Links'
    HalLinks:
      type: object
      properties:
        _links:
          $ref: '#/components/schemas/Links'
    Links:
      type: object
      additionalProperties:
        type: object
        properties:
          href:
            type: string
            format: uri
          templated:
            type: boolean
    ApiError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        validationErrors:
          type: object
          additionalProperties:
            type: string

  responses:
    BadRequest:
      description: Invalid request body or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Operation conflicts with the current resource state, for example no available copies
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
